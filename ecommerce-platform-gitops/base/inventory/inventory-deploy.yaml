apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auraweb
  name: inventory-deploy
  labels:
    app: inventory-deploy
spec:
  selector:
    matchLabels:
      app: inventory-pod-deploy
  template:
    metadata:
      labels:
        app: inventory-pod-deploy
    spec:
      serviceAccountName: inventoryservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: inventory
          image: kubeprojects/inventory:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "64Mi"
              memory: "50m"
            limits:
              cpu: "128Mi"
              memory: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /
              port: 8080
