apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auraweb
  name: inventory-deploy
  labels:
    app: inventory-deploy
spec:
  selector:
    matchLabels:
      app: inventory-pod-deploy
  template:
    metadata:
      labels:
        app: inventory-pod-deploy
    spec:
      serviceAccountName: inventoryservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: inventory
          image: kubeprojects/inventory:4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3006"
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: auraweb_db
            - name: DB_USER
              value: auraweb_user
            - name: DB_PASSWORD
              value: password
            - name: RABBITMQ_URL
              value: amqp://rabbitmq-service:5672
          ports:
            - containerPort: 3006
          resources:
            requests:
              cpu: "64m"
              memory: "256Mi"
            limits:
              cpu: "256m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /health
              port: 3006
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /health
              port: 3006
