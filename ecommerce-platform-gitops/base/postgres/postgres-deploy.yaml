apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auraweb
  name: postgres-deploy
  labels:
    app: postgres-deploy
spec:
  selector:
    matchLabels:
      app: postgres-pod-deploy
  template:
    metadata:
      labels:
        app: postgres-pod-deploy
    spec:
      serviceAccountName: postgresservice
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: auraweb_user
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: auraweb_db
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "64m"
              memory: "50Mi"
            limits:
              cpu: "256m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            tcpSocket:
              port: 5432
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            tcpSocket:
              port: 5432
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
