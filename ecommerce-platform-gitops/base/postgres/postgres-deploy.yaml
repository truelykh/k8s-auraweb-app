apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auraweb
  name: postgres-deploy
  labels:
    app: postgres-deploy
spec:
  selector:
    matchLabels:
      app: postgres-pod-deploy
  template:
    metadata:
      labels:
        app: postgres-pod-deploy
    spec:
      serviceAccountName: postgresservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "64Mi"
              memory: "50m"
            limits:
              cpu: "128Mi"
              memory: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            tcpSocket:
              port: 5432
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            tcpSocket:
              port: 5432
