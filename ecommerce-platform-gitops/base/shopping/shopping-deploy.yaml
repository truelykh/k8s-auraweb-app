apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auraweb
  name: shopping-deploy
  labels:
    app: shopping-deploy
spec:
  selector:
    matchLabels:
      app: shopping-pod-deploy
  template:
    metadata:
      labels:
        app: shopping-pod-deploy
    spec:
      serviceAccountName: shoppingservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: shopping
          image: kubeprojects/shopping:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3004"
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: auraweb_db
            - name: DB_USER
              value: auraweb_user
            - name: DB_PASSWORD
              value: password
            - name: REDIS_HOST
              value: redis-service
          ports:
            - containerPort: 3004
          resources:
            requests:
              cpu: "64m"
              memory: "256Mi"
            limits:
              cpu: "256m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /health
              port: 3004
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /health
              port: 3004
