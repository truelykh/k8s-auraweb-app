apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auraweb
  name: user-auth-deploy
  labels:
    app: user-auth-deploy
spec:
  selector:
    matchLabels:
      app: user-auth-pod-deploy
  template:
    metadata:
      labels:
        app: user-auth-pod-deploy
    spec:
      serviceAccountName: user-authservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: user-auth
          image: kubeprojects/userauth:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: auraweb_db
            - name: DB_USER
              value: auraweb_user
            - name: DB_PASSWORD
              value: password
            - name: REDIS_HOST
              value: redis-service
            - name: RABBITMQ_URL
              value: amqp://rabbitmq-service:5672
            - name: JWT_SECRET
              value: secret
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "64Mi"
              memory: "256Mi"
            limits:
              cpu: "256Mi"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /health
              port: 3000
