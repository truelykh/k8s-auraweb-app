apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auraweb
  name: frontend-deploy
  labels:
    app: frontend-deploy
spec:
  selector:
    matchLabels:
      app: frontend-pod-deploy
  template:
    metadata:
      labels:
        app: frontend-pod-deploy
    spec:
      serviceAccountName: frontendservice
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: frontend
          image: kubeprojects/frontend:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "64m"
              memory: "50Mi"
            limits:
              cpu: "128m"
              memory: "200Mi"
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            httpGet:
              path: /
              port: 8080
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
