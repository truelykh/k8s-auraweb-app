apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auraweb-ecommerce-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/ecommerce-platform-gitops.git' # Update to your actual Git repo URL
    targetRevision: HEAD
    path: base
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: auraweb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
